apiVersion: apps/v1
kind: Deployment
metadata:
  name: carnac-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: carnac
  template:
    metadata:
      labels:
        app: carnac
    spec:
      containers:
        - name: carnac
          image: doddering-stallwart/carnac:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: carnac-service
spec:
  type: ClusterIP
  selector:
    app: carnac
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80